<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads — Nekomo</title>
    <meta name="theme-color" content="#8d2249" />
    <meta name="robots" content="noindex">
    <link rel="icon" href="/Images/nekomo-logo-sakura.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/theme.js" defer></script>
    <style>
        :root {
            --bg: #0c0508;
            --surface: rgba(255, 92, 122, 0.05);
            --surface-border: rgba(255, 92, 122, 0.14);
            --accent-bright: #ff5c7a;
            --accent-deep: #8d2249;
            --text: #f7ecf0;
            --text-muted: #b9929f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(229, 57, 95, 0.18), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            padding: 24px;
            overflow-x: hidden;
            max-width: 100vw;
        }
        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #150910;
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }
        .card img { width: 88px; border-radius: 18px; filter: drop-shadow(0 0 20px rgba(255, 92, 122, 0.35)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; margin-top: 18px; }
        .version {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            font-size: 0.82rem;
            color: var(--text-muted);
            min-height: 1.6em;
        }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255, 92, 122, 0.25);
            border-top-color: var(--accent-bright);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p.hint { margin-top: 16px; font-size: 0.86rem; color: var(--text-muted); }
        .manual-link { display: none; margin-top: 20px; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .manual-link.nk-visible { display: flex; }
        .manual-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-deep));
            color: #fff;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.92rem;
        }
        .manual-link a.ghost {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text);
        }
        .platform-note { margin-top: 14px; font-size: 0.78rem; color: var(--text-muted); }
        .changelog-link { display: block; margin-top: 18px; font-size: 0.82rem; }
        .changelog-link a { color: var(--accent-bright); text-decoration: none; }
        .changelog-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/Images/nekomo-logo-sakura.jpg" alt="Nekomo cat">
        <h1 id="title">Preparing your download&hellip;</h1>
        <div class="version"><span class="spinner" id="spinner"></span> <span id="version-text">Checking latest release</span></div>
        <p class="hint" id="hint">Fetching the newest official build from GitHub — this only takes a second.</p>
        <div class="manual-link" id="manual-link">
            <a id="manual-btn" href="https://github.com/Nekomo-App/Nekomo/releases">Continue manually</a>
        </div>
        <p class="platform-note">📱🖥️ Android &amp; Android TV only — not available on iOS/Apple devices.</p>
        <p class="changelog-link"><a href="/updates.html">View full changelog &amp; release history</a></p>
    </div>

    <script>
        document.getElementById('title').textContent = 'Downloads aren’t available yet';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('version-text').textContent = 'Beta testing only';
        document.getElementById('hint').textContent = 'Nekomo isn’t publicly released yet. Test builds are only available through the Beta page.';
        var manual = document.getElementById('manual-link');
        manual.innerHTML = '<a href="/beta">Go to the Beta page</a><a class="ghost" href="https://discord.com/invite/E4Ezmgg7Ka" target="_blank" rel="noopener">Ask on Discord</a>';
        manual.classList.add('nk-visible');
    </script>
</body>
</html>
