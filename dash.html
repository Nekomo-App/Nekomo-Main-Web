<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
  body{background:#0c0508;color:#e8d5dc;font-family:Inter,system-ui,sans-serif;max-width:640px;margin:0 auto;padding:32px 16px}
  h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
  .sub{color:#8a6a76;font-size:.85rem;margin-bottom:24px}
  input,button{background:#1a0e13;border:1px solid #3a2530;color:#e8d5dc;border-radius:10px;padding:10px 14px;font-size:.95rem}
  input{width:100%;box-sizing:border-box;margin-bottom:10px}
  button{cursor:pointer;font-weight:600}
  button:hover{background:#2a1620}
  .card{background:#140a10;border:1px solid #2a1620;border-radius:14px;padding:16px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #231218;font-size:.9rem}
  .row:last-child{border-bottom:none}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
  .on{background:#4ade80}.off{background:#52525b}
  .mono{font-family:ui-monospace,monospace;font-size:.8rem;color:#a18997}
  .accent{color:#ff5c7a}.muted{color:#8a6a76;font-size:.8rem}
  .flex{display:flex;gap:8px}.hidden{display:none}
  a{color:#ff5c7a}
</style>
</head>
<body>
<div id="login">
  <h1>Staff sign in</h1><p class="sub">NekōX members — restricted</p>
  <input id="u" placeholder="Username" autocomplete="off"><br>
  <input id="p" type="password" placeholder="Password"><br>
  <input id="hp" type="text" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" aria-hidden="true"><br>
  <label class="botchk"><input id="notbot" type="checkbox"> I'm not a robot</label><br>
  <p id="botq" class="muted"></p>
  <input id="bota" inputmode="numeric" placeholder="Answer"><br>
  <button id="signinBtn" onclick="staffSignin()" disabled>Sign in</button>
  <p id="loginMsg" class="muted"></p>
  <p class="muted">Save your credentials somewhere safe — there's no password reset.</p>
</div>

<div id="board" class="hidden">
  <div class="flex" style="justify-content:space-between;align-items:baseline">
    <h1>Members</h1>
    <button onclick="staffSignout()">Sign out</button>
  </div>
  <div id="statbar" class="flex" style="gap:10px;margin-bottom:16px;flex-wrap:wrap"></div>
  <div class="card" id="members"></div>
  <div class="card">
    <div class="flex" style="justify-content:space-between;align-items:baseline">
      <h1>Invite keys</h1>
      <div class="flex"><input id="mintName" placeholder="Friend name" style="width:140px;margin:0"><button onclick="mint()">Mint</button></div>
    </div>
    <div id="keys"></div>
    <p id="newKey" class="accent mono"></p>
  </div>
  <div class="card">
    <h1>All sign-in keys</h1>
    <div id="allkeys"></div>
  </div>
  <div class="card">
    <h1>Abuse flags</h1>
    <div id="abuse"></div>
  </div>
</div>

<script>
const API = "/api/anime";
const tok = () => sessionStorage.getItem("nx_staff") || "";
async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(tok())}`, opts);
  return r.json();
}
async function staffSignin() {
  const r = await fetch(`${API}/staff/login`, { method: "POST", body: JSON.stringify({ u: document.getElementById('u').value.trim(), p: document.getElementById('p').value }) });
  const d = await r.json();
  if (d.ok) { sessionStorage.setItem("nx_staff", d.token); show(); }
  else document.getElementById('loginMsg').textContent = "Invalid staff credentials.";
}
async function show() {
  login.classList.add("hidden"); board.classList.remove("hidden");
  const m = await api("/admin/members");
  if (m && m.ok === false) { // staff token expired/invalid — back to sign-in
    sessionStorage.removeItem("nx_staff");
    board.classList.add("hidden"); login.classList.remove("hidden");
    document.getElementById('loginMsg').textContent = "Session expired — sign in again.";
    return;
  }
  const ak = await api("/admin/allkeys");
  const k = await api("/admin/keys");
  const ab = await api("/admin/abuse");
  statbar.innerHTML = [
    ["Members", (m.members || []).length], ["Online", m.online || 0],
    ["Keys", k.count || 0], ["Used", k.used || 0], ["Unused", k.unused || 0],
    ["Sign-ins", (ak.keys || []).length], ["Abuse", ab.count || 0],
  ].map(([l, v]) => `<div class="card" style="padding:10px 16px;margin:0"><div style="font-size:20px;font-weight:700">${v}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">${l}</div></div>`).join("");
  const sorted = (m.members || []).slice().sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
  members.innerHTML = sorted.length ? sorted.map(x =>
    `<div class="row"><span>${x.name ? `<b>${x.name}</b>` : "—"} <span class="mono">${x.id}…</span><br><span class="muted">${x.discord || "no discord"} · ${x.devices || 1} device${(x.devices || 1) > 1 ? "s" : ""}${(x.keys || 1) > 1 ? ` · ${x.keys} keys` : ""}</span>${(x.deviceIds || []).length ? `<br><span class="muted">devices: ${x.deviceIds.map(d => `<button class="mono" style="padding:2px 8px;font-size:.72rem" onclick="kick('${d}','${(x.name || "member").replace(/'/g, "")}')">${d} ✕</button>`).join(" ")}</span>` : ""}</span><span><span class="dot ${x.online ? "on" : "off"}"></span>${x.online ? "online" : "offline"}</span></div>`
  ).join("") : '<p class="muted">No members online yet — heartbeats appear after first app launch.</p>';
  const list = ak.keys || [];
  const grp = (items, label, render, openFirst) => items.length ? `<details ${openFirst ? "open" : ""} style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600">${label} — ${items.length}</summary>${items.map(render).join("")}</details>` : "";
  const rMember = x => `<div class="row"><span><span class="mono">${x.hash}…</span> <span class="muted">${x.type}${x.name ? " · " + x.name : ""}${x.discord ? " · " + x.discord : ""} · ${x.devices || 0} dev</span></span></div>`;
  const rFriend = x => `<div class="row"><span class="mono">${x.key}</span><span class="muted">friend · of ${x.parent}</span></div>`;
  const rSeed = x => `<div class="row"><span class="mono">${x.key}</span><span class="muted">member · seed</span></div>`;
  allkeys.innerHTML =
    grp(list.filter(x => x.type !== "friend" && !x.seed), "Member keys", rMember, true) +
    grp(list.filter(x => x.type === "friend"), "Friend codes", rFriend) +
    grp(list.filter(x => x.seed), "Seed codes", rSeed) ||
    '<p class="muted">No keys.</p>';
  abuse.innerHTML = (ab.abuse || []).length ? ab.abuse.map(x =>
    `<div class="row"><span class="mono">device ${x.did}…</span><span class="muted">${(x.keys || []).length} keys</span></div>`
  ).join("") : '<p class="muted">No flagged devices.</p>';
  const ks = (k.keys || []).slice().sort((a, b) => (b.used ? 1 : 0) - (a.used ? 1 : 0));
  keys.innerHTML = ks.map(x =>
    `<div class="row"><span><span class="dot ${x.used ? "on" : "off"}"></span><span class="mono">${x.hash}…</span> <span class="muted">${x.type}${x.name ? "· " + x.name : ""}${x.discord ? "· " + x.discord : ""} · ${x.devices} dev</span></span><span class="flex">${(x.devices || 0) > 0 ? `<button onclick="resetDevs('${x.hash}',${x.devices})">Reset</button>` : ""}<button onclick="revoke('${x.hash}')">Revoke</button></span></div>`
  ).join("");
}
function staffSignout() {
  if (!confirm("Sign out of the staff dashboard?")) return;
  sessionStorage.removeItem("nx_staff"); location.reload();
}
async function mint() {
  const d = await api(`/admin/keys?mint=${encodeURIComponent(mintName.value || "friend")}`);
  if (d.key) { newKey.textContent = `Share once: ${d.key}`; show(); }
}
async function kick(did, who) {
  if (!confirm(`Kick device ${did} from ${who}? They're signed out immediately.`)) return;
  const d = await api(`/admin/kick?did=${encodeURIComponent(did)}`);
  if (d.ok === false) alert(d.error || "Kick failed — device not found.");
  show();
}
async function resetDevs(h, n) {
  if (!confirm(`Free all ${n} device slot(s) on key ${h}…? Signed-in devices are signed out.`)) return;
  const d = await api(`/admin/keys?resetDevices=${encodeURIComponent(h)}`);
  if (d.ok === false) alert(d.error || "Reset failed.");
  show();
}
async function revoke(h) {
  if (!confirm(`Revoke key ${h}…? This permanently bans it — every signed-in device is kicked.`)) return;
  const d = await api(`/admin/keys?hash=${h}`, { method: "DELETE" });
  if (d.ok === false) alert(d.error || "Revoke failed — key not found.");
  show();
}
if (tok()) show();
</script>
<script>
// Simple bot verification: checkbox + math answer + honeypot.
const q1 = 2 + Math.floor(Math.random() * 7), q2 = 1 + Math.floor(Math.random() * 8);
document.getElementById('botq').textContent = `Bot check: what is ${q1} + ${q2}?`;
function botOk() {
  const ok = document.getElementById('notbot').checked
    && parseInt(document.getElementById('bota').value, 10) === q1 + q2
    && !document.getElementById('hp').value;
  document.getElementById('signinBtn').disabled = !ok;
}
['notbot','bota'].forEach(id => document.getElementById(id).addEventListener('input', botOk));
document.getElementById('notbot').addEventListener('change', botOk);
// Page hardening — deterrent only; real auth is server-side.
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => { if (!/input|textarea/i.test(e.target.tagName)) e.preventDefault(); });
document.addEventListener('copy', e => { if (!/input|textarea/i.test(e.target.tagName)) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && 'IJC'.includes(e.key.toUpperCase())) || (e.ctrlKey && 'US'.includes(e.key.toUpperCase()))) e.preventDefault();
});
setInterval(() => { if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) document.body.style.filter = 'blur(6px)'; }, 800);
</script>
</body>
</html>
