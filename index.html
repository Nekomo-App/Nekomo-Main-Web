<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify — Nekomo</title>
    <meta name="description" content="Quick human check before entering the Nekomo website.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://nekomoapp.netlify.app/home">
    <meta name="theme-color" content="#8d2249" />
    <link rel="icon" href="/Images/nekomo-logo-sakura.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0508;
            --accent: #e5395f;
            --accent-bright: #ff5c7a;
            --accent-deep: #8d2249;
            --text: #f7ecf0;
            --text-muted: #b9929f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }
        .bg-fx {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(229, 57, 95, 0.18), transparent 60%),
                radial-gradient(ellipse 50% 40% at 85% 90%, rgba(141, 34, 73, 0.14), transparent 60%),
                var(--bg);
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #150910;
            border: 1px solid rgba(255, 92, 122, 0.25);
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(229, 57, 95, 0.12);
            animation: pop .35s ease;
        }
        @keyframes pop { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: none; } }
        .card.shake { animation: shake .4s ease; }
        @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .card img { width: 72px; border-radius: 16px; filter: drop-shadow(0 0 18px rgba(255, 92, 122, .35)); }
        .card h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; margin-top: 16px; letter-spacing: -.01em; }
        .card .sub { font-size: .88rem; color: var(--text-muted); margin-top: 8px; line-height: 1.6; }
        .puzzle-q { font-family: 'Outfit', sans-serif; font-size: 1.02rem; font-weight: 600; margin: 20px 0 16px; }
        .puzzle-q b { color: var(--accent-bright); }
        .puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .puzzle-opt {
            font-size: 1.9rem; line-height: 1; padding: 16px 0;
            background: rgba(255, 92, 122, .06); border: 1px solid rgba(255, 92, 122, .2);
            border-radius: 14px; cursor: pointer;
            transition: border-color .2s, background .2s, transform .15s;
        }
        .puzzle-opt:hover { background: rgba(255, 92, 122, .14); border-color: rgba(255, 92, 122, .4); }
        .puzzle-opt:active { transform: scale(.93); }
        .error { min-height: 1.3em; margin-top: 14px; font-size: .82rem; color: #ff7a95; }
        .footer-links { margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(255, 92, 122, .12); font-size: .78rem; color: var(--text-muted); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }
        .footer-links a:hover { color: var(--accent-bright); }
        @media (max-width: 420px) { .card { padding: 30px 20px; } .puzzle-opt { font-size: 1.6rem; padding: 12px 0; } }
    </style>
</head>
<body>
    <div class="bg-fx"></div>
    <main class="card" id="card" aria-live="polite">
        <img src="/Images/nekomo-logo-sakura.jpg" alt="Nekomo cat">
        <h1>Quick check</h1>
        <p class="sub">Just a quick click to prove you're not a bot before entering Nekomo.</p>
        <div class="puzzle-q">Click the <b>cherry blossom</b> 🌸</div>
        <div class="puzzle-grid" id="grid" role="group" aria-label="Puzzle options"></div>
        <p class="error" id="error" role="alert"></p>
        <div class="footer-links">
            <a href="/terms">Terms</a>
            <a href="/privacy">Privacy</a>
            <a href="/dmca.html">DMCA</a>
            <a href="/sitemap.html">Sitemap</a>
            <a href="https://discord.com/invite/E4Ezmgg7Ka" target="_blank" rel="noopener">Discord</a>
        </div>
    </main>

    <script>
        // Same verification mechanic & localStorage key as gate.js, so /home
        // won't ask again once this page has been passed.
        var VERIFIED_KEY = 'nekomo_verified_v1';
        var TARGET = '🌸';
        var DISTRACTORS = ['🐾', '🍡', '🎋', '🍜', '⭐', '🌙', '🎮', '🍵', '🐟', '🧋'];
        var DEST = '/home';

        if (localStorage.getItem(VERIFIED_KEY)) {
            window.location.replace(DEST);
        }

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            }
            return arr;
        }

        var card = document.getElementById('card');
        var grid = document.getElementById('grid');
        var error = document.getElementById('error');

        function render() {
            grid.innerHTML = '';
            var options = shuffle(shuffle(DISTRACTORS.slice()).slice(0, 5).concat([TARGET]));
            shuffle(options).forEach(function (emoji) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'puzzle-opt';
                btn.textContent = emoji;
                btn.setAttribute('aria-label', emoji === TARGET ? 'cherry blossom' : 'option');
                btn.addEventListener('click', function () {
                    if (emoji === TARGET) {
                        localStorage.setItem(VERIFIED_KEY, '1');
                        window.location.href = DEST;
                    } else {
                        error.textContent = 'Not quite — try again.';
                        card.classList.remove('shake');
                        void card.offsetWidth;
                        card.classList.add('shake');
                        render();
                    }
                });
                grid.appendChild(btn);
            });
        }
        render();
    </script>
</body>
</html>
